<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#9da489] min-h-screen flex flex-col">
    <nav class="bg-[#2c190c]">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="http://localhost:8080/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="../static/images/logo.png" class="h-12 rounded-lg" alt="Bookstore Logo" />
                <span class="self-center text-2xl text-[#eadbc5] font-semibold whitespace-nowrap">BookStore</span>
            </a>
        </div>
    </nav>

    <main class="flex flex-1 flex-col items-center justify-center p-6">
        <div class="bg-[#eadbc5] p-10 gap-6 w-full max-w-lg  rounded-lg">
            <form class="w-full" action="/api/users/login" method="POST">
                <h2 class="text-[#2c190c] text-3xl font-semibold mb-8">
                    Sign in
                </h2>

                <div class="space-y-6">
                    <p class=" text-[15px] mt-6 mb-6 text-[#2c190c]">Don't have an account <a href="javascript:void(0);"
                            class="text-[#5d6650] font-medium hover:underline ml-1">Register
                            here</a></p>
                </div>

                <div class="space-y-6 ">
                    <div>
                        <label class=" text-sm  text-[#2c190c] font-medium mb-2 block ">Email</label>
                        <input name="email" type="email"
                            class=" bg-slate-100 w-full text-sm  text-[#2c190c] px-4 py-3 rounded-md outline-0 border border-gray-200 focus:border-[#2c190c]"
                            placeholder="Enter Email">
                        <div id="email-error" class="text-sm text-red-500 mt-2">Please enter a valid email.</div>
                    </div>
                    <div>
                        <label class="text-sm  text-[#2c190c] font-medium mb-2 block ">Password</label>
                        <input name="password" type="password"
                            class=" bg-slate-100 w-full text-sm text-[#2c190c] px-4 py-3 rounded-md outline-0 border border-gray-200 focus:border-[#2c190c]"
                            placeholder="Enter Password">
                        <div id="email-error" class="text-sm text-red-500 mt-2">Please enter a valid password.</div>
                    </div>
                    <div class=" flex flex-wrap items-center justify-end">
                        <div class=" text-sm ">
                            <a href="jajvascript:void(0);" class="text-[#5d6650] hover:underline font-medium ">
                                Forgot your password?
                            </a>
                        </div>
                    </div>
                </div>

                <div class="!mt-8">
                    <button type="submit"
                        class="bg-[#5d6650] hover:bg-[#2c190c] w-full shadow-xl py-2.5 px-4 text-[15px] font-medium rounded-md text-white focus:outline-none cursor-pointer">
                        Log in
                    </button>
                </div>

                <div class=" my-6 flex items-center gap-4 ">
                    <hr class=" w-full border-[#9da489]">
                    <p class=" text-sm  text-[#2c190c] text-center">or</p>
                    <hr class=" w-full border-[#9da489]">
                </div>

                <div class=" space-x-6 flex justify-center">
                    <button type="button" onclick="window.location.href='/auth/google'"
                        class=" border-0 outline-0 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class=" w-6 h-6 " viewBox="0 0 512 512">
                            <path fill="#fbbd00"
                                d="M120 256c0-25.367 6.989-49.13 19.131-69.477v-86.308H52.823C18.568 144.703 0 198.922 0 256s18.568 111.297 52.823 155.785h86.308v-86.308C126.989 305.13 120 281.367 120 256z"
                                data-original="#fbbd00"></path>
                            <path fill="#0f9d58"
                                d="m256 392-60 60 60 60c57.079 0 111.297-18.568 155.785-52.823v-86.216h-86.216C305.044 385.147 281.181 392 256 392z"
                                data-original="#0f9d58"></path>
                            <path fill="#31aa52"
                                d="m139.131 325.477-86.308 86.308a260.085 260.085 0 0 0 22.158 25.235C123.333 485.371 187.62 512 256 512V392c-49.624 0-93.117-26.72-116.869-66.523z"
                                data-original="#31aa52"></path>
                            <path fill="#3c79e6"
                                d="M512 256a258.24 258.24 0 0 0-4.192-46.377l-2.251-12.299H256v120h121.452a135.385 135.385 0 0 1-51.884 55.638l86.216 86.216a260.085 260.085 0 0 0 25.235-22.158C485.371 388.667 512 324.38 512 256z"
                                data-original="#3c79e6"></path>
                            <path fill="#cf2d48"
                                d="m352.167 159.833 10.606 10.606 84.853-84.852-10.606-10.606C388.668 26.629 324.381 0 256 0l-60 60 60 60c36.326 0 70.479 14.146 96.167 39.833z"
                                data-original="#cf2d48"></path>
                            <path fill="#eb4132"
                                d="M256 120V0C187.62 0 123.333 26.629 74.98 74.98a259.849 259.849 0 0 0-22.158 25.235l86.308 86.308C162.883 146.72 206.376 120 256 120z"
                                data-original="#eb4132"></path>
                        </svg>
                    </button>

                    <button type="button" onclick="window.location.href='/auth/apple'"
                        class=" border-0 outline-0 cursor-pointer ">
                        <svg xmlns="http://www.w3.org/2000/svg" class=" w-6 h-6 " viewBox="0 0 22.773 22.773">
                            <path
                                d="M15.769 0h.162c.13 1.606-.483 2.806-1.228 3.675-.731.863-1.732 1.7-3.351 1.573-.108-1.583.506-2.694 1.25-3.561C13.292.879 14.557.16 15.769 0zm4.901 16.716v.045c-.455 1.378-1.104 2.559-1.896 3.655-.723.995-1.609 2.334-3.191 2.334-1.367 0-2.275-.879-3.676-.903-1.482-.024-2.297.735-3.652.926h-.462c-.995-.144-1.798-.932-2.383-1.642-1.725-2.098-3.058-4.808-3.306-8.276v-1.019c.105-2.482 1.311-4.5 2.914-5.478.846-.52 2.009-.963 3.304-.765.555.086 1.122.276 1.619.464.471.181 1.06.502 1.618.485.378-.011.754-.208 1.135-.347 1.116-.403 2.21-.865 3.652-.648 1.733.262 2.963 1.032 3.723 2.22-1.466.933-2.625 2.339-2.427 4.74.176 2.181 1.444 3.457 3.028 4.209z"
                                data-original="#000000"></path>
                        </svg>
                    </button>

                    <button type="button" onclick="window.location.href='/auth/microsoft'"
                        class="border-0 outline-0 cursor-pointer">
                        <!-- Microsoft SVG icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 32 32">
                            <rect x="2" y="2" width="13" height="13" fill="#f25022" />
                            <rect x="17" y="2" width="13" height="13" fill="#7fba00" />
                            <rect x="2" y="17" width="13" height="13" fill="#00a4ef" />
                            <rect x="17" y="17" width="13" height="13" fill="#ffb900" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-[#5d6650] text-[#eadbc5] text-center py-4 mt-auto w-full">
        © 2025 Bookstore™. All Rights Reserved.
    </footer>
</body>

</html>
